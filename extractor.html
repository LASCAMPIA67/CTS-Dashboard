<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>CTS PDF Engine</title>
</head>

<body>
<script>
  window.__ctsPdfReady = false
  window.__ctsPdfBootError = ""

  function storeBootError(value) {
    if (
      window.__ctsPdfBootError
    ) {
      return
    }

    window.__ctsPdfBootError =
      value &&
      value.message
        ? String(
            value.message
          )
        : String(
            value ||
            "Erreur PDF.js inconnue"
          )
  }

  window.addEventListener(
    "error",
    event => {
      storeBootError(
        event.error ||
        event.message
      )
    }
  )

  window.addEventListener(
    "unhandledrejection",
    event => {
      storeBootError(
        event.reason
      )
    }
  )
</script>

<script type="module">
  import * as pdfjsLib
    from "./pdf.min.mjs"

  pdfjsLib
    .GlobalWorkerOptions
    .workerSrc =
      "./pdf.worker.min.mjs"

  function decodeBase64(base64) {
    const binary =
      atob(base64)

    const bytes =
      new Uint8Array(
        binary.length
      )

    for (
      let index = 0;
      index < binary.length;
      index++
    ) {
      bytes[index] =
        binary.charCodeAt(
          index
        )
    }

    return bytes
  }

  function textFromContent(content) {
    const lines = []
    let currentLine = []
    let previousY = null

    const flushLine = () => {
      const line =
        currentLine
          .join(" ")
          .replace(
            /\s+/g,
            " "
          )
          .trim()

      if (line) {
        lines.push(line)
      }

      currentLine = []
    }

    for (
      const item
      of content.items || []
    ) {
      if (
        !item ||
        typeof item.str !==
          "string"
      ) {
        continue
      }

      const currentY =
        Array.isArray(
          item.transform
        )
          ? Number(
              item.transform[5]
            )
          : null

      if (
        currentLine.length &&
        Number.isFinite(
          previousY
        ) &&
        Number.isFinite(
          currentY
        ) &&
        Math.abs(
          currentY -
          previousY
        ) > 2
      ) {
        flushLine()
      }

      const value =
        item.str
          .replace(
            /\s+/g,
            " "
          )
          .trim()

      if (value) {
        currentLine.push(
          value
        )
      }

      if (item.hasEOL) {
        flushLine()
      }

      if (
        Number.isFinite(
          currentY
        )
      ) {
        previousY =
          currentY
      }
    }

    flushLine()

    return lines.join(
      "\n"
    )
  }

  window.__ctsExtractPdfText =
    async base64 => {
      let document = null

      try {
        const bytes =
          decodeBase64(
            base64
          )

        const loadingTask =
          pdfjsLib.getDocument({
            data: bytes,
            isEvalSupported: false
          })

        document =
          await loadingTask.promise

        const pages = []

        for (
          let pageNumber = 1;
          pageNumber <=
            document.numPages;
          pageNumber++
        ) {
          const page =
            await document
              .getPage(
                pageNumber
              )

          const content =
            await page
              .getTextContent()

          pages.push(
            textFromContent(
              content
            )
          )

          page.cleanup()
        }

        const text =
          pages
            .join("\n")
            .replace(
              /[ \t]+/g,
              " "
            )
            .replace(
              / *\n */g,
              "\n"
            )
            .replace(
              /\n{3,}/g,
              "\n\n"
            )
            .trim()

        return {
          ok: true,
          text,

          pageCount:
            document.numPages,

          error: ""
        }
      } catch (error) {
        return {
          ok: false,
          text: "",
          pageCount: 0,

          error:
            error &&
            error.message
              ? String(
                  error.message
                )
              : String(error)
        }
      } finally {
        if (
          document &&
          typeof document.destroy ===
            "function"
        ) {
          try {
            await document.destroy()
          } catch (error) {}
        }
      }
    }

  window.__ctsPdfReady = true
</script>
</body>
</html>
