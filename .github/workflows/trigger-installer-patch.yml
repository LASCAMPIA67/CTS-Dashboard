name: Trigger installer migration

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch migration workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run patch-installer-105.yml --ref main
