name: Publier les Releases

on:
  push:
    branches: [main]
    paths: [version.json]

  workflow_dispatch:

# Deux passages simultanés poseraient le même tag, et le second échouerait.
concurrency:
  group: releases

# Aucune permission plus étroite ne permet de publier une Release.
permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Tout l'historique : le commit d'arrivée d'un numéro et la Release précédente de sa famille s'y lisent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Publier les Releases dues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release.mjs
