name: Publier les Releases

# Chaque numéro publié a sa Release, posée sur le commit de main où il est
# arrivé. Elle sert de registre et ne livre rien : CTS Installer lit la
# révision de main, jamais un tag. Ce qui publie sur les iPhone reste la
# fusion elle-même.

on:
  push:
    branches: [main]
    paths: [version.json]

  # Pour relancer une Release en échec, et pour la première : celle des
  # numéros déjà en service quand le suivi a commencé.
  workflow_dispatch:

# Un passage à la fois : deux passages simultanés poseraient le même tag,
# et le second échouerait. Celui qui attend voit les tags déjà posés, et ne
# publie que ce qui manque.
concurrency:
  group: releases

# Nommer une seule permission retire toutes les autres au jeton. Celle-ci
# reste large — elle permet aussi de pousser des branches et des tags —,
# mais aucune plus étroite ne permet de publier une Release.
permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Tout l'historique et tous les tags : le commit où un numéro est
      # arrivé, et la Release précédente de la même famille, s'y lisent. Le
      # jeton ne reste pas dans le dépôt cloné : seul gh s'en sert.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Publier les Releases dues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release.mjs
