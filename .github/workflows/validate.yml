name: Validate CTS Dashboard

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cts-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository
        run: node .github/scripts/validate.mjs

      # Une fonction manquante entre modules survit à la syntaxe et
      # n'échoue que le matin où un conducteur regarde son widget.
      - name: Run module reference test
        run: node tools/preview/modules-smoke.mjs

      # Une analyse statique ne voit pas une constante inaccessible à
      # l'exécution : ces deux tests exécutent réellement les scripts,
      # point d'entrée compris, sur des doublures hors ligne.
      # Un verrou laissé par un widget tué ne doit pas empêcher
      # l'application d'importer la carte agent.
      - name: Run services scan test
        run: node tools/preview/scan-smoke.mjs

      # Un service terminé ne doit ni disparaître trop tôt, ni bloquer le
      # suivant : la temporisation dépend de la présence d'une carte agent.
      - name: Run service handover test
        run: node tools/preview/selection-smoke.mjs

      # La grille du bandeau horaires n'est symétrique que si elle entre
      # dans la carte : sans jeu, l'alignement casse selon l'appareil.
      - name: Run layout geometry test
        run: node tools/preview/layout-smoke.mjs

      # withTimeout borne tout ce que le projet ne peut pas annuler.
      - name: Run shared primitives test
        run: node tools/preview/utils-smoke.mjs

      - name: Run CTS Dashboard smoke test
        run: node tools/preview/dashboard-smoke.mjs

      - name: Run CTS Installer smoke test
        run: node tools/preview/installer-smoke.mjs

      - name: Run CTS Repair smoke test
        run: node tools/preview/repair-smoke.mjs

      # Les bases peuvent être valides et pourtant nommer un lieu
      # « Code ELSA_C » : seule une résolution réelle le montre.
      - name: Run database resolution test
        run: node tools/preview/database-smoke.mjs

      # iCloud peut refuser de déclarer disponible un fichier pourtant
      # lisible : le widget concluait alors « aucun service » en silence.
      - name: Run iCloud read test
        run: node tools/preview/storage-smoke.mjs

      # Le vidage du cache et l'archivage suivent la fin du service d'une
      # heure : seul un enchaînement rejoué le vérifie.
      - name: Run services cleanup test
        run: node tools/preview/cleanup-smoke.mjs

      # Une copie de sécurité orpheline peut être le dernier exemplaire
      # d'un fichier : le balayage doit la conserver, pas la ranger.
      - name: Run write residue test
        run: node tools/preview/residue-smoke.mjs

      # Retirer un service ne doit emporter que ses fichiers, et jamais
      # conclure à une suppression quand iCloud a simplement du retard.
      - name: Run service removal test
        run: node tools/preview/removal-smoke.mjs

      # Un verrou se juge sur ses faux positifs : hors ligne, sans
      # politique ou avec un plancher incohérent, le widget doit marcher.
      - name: Run version gate test
        run: node tools/preview/version-gate-smoke.mjs
