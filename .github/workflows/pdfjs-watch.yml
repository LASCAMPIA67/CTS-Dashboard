name: Veille PDF.js

on:
  # En UTC : 8 h 17 à Strasbourg en été, 7 h 17 en hiver.
  schedule:
    - cron: '17 6 * * 1'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Comparer à la version publiée
        id: watch
        run: node .github/scripts/pdfjs-watch.mjs

      - name: Valider le dépôt
        if: steps.watch.outputs.changed == 'true'
        run: node .github/scripts/validate.mjs

      - name: Éprouver le moteur PDF
        if: steps.watch.outputs.changed == 'true'
        run: node tools/preview/pdf-engine-smoke.mjs

      - name: Ouvrir la pull request
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.watch.outputs.pinned }}
          PUBLISHED: ${{ steps.watch.outputs.published }}
          MAJOR: ${{ steps.watch.outputs.major }}
        run: |
          BRANCH="veille/pdfjs-${PUBLISHED}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "La branche $BRANCH existe déjà : pull request en attente."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "CTS PDF Engine.js" pdf.min.mjs pdf.worker.min.mjs
          git commit -m "Relever PDF.js de ${PINNED} à ${PUBLISHED}"
          git push -u origin "$BRANCH"

          if [ "$MAJOR" = "true" ]; then
            WARNING="**Changement de version MAJEURE.** L'interface de PDF.js peut avoir changé : à lire avant tout le reste."
          else
            WARNING="Version mineure. L'interface de PDF.js ne devrait pas avoir changé."
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Relever PDF.js de ${PINNED} à ${PUBLISHED}" \
            --body "$(cat <<EOF
          Ouverte par la veille hebdomadaire. Personne n'a rien décidé.

          $WARNING

          ## Ce que la CI a prouvé

          Le validateur accepte les deux fichiers et confirme qu'ils
          portent bien \`${PUBLISHED}\`, et \`pdf-engine-smoke.mjs\` passe.

          ## Ce qu'elle n'a pas prouvé

          Ce banc tourne dans Node, sur des doublures, et **ne peut pas
          ouvrir de WebView**. Rien ici ne dit que PDF.js \`${PUBLISHED}\`
          lit une vraie carte agent sur un iPhone — encore moins sur les
          appareils restés en iOS 18.

          ## Avant de fusionner

          1. Lancer la validation : GitHub ne la démarre pas seul sur une
             pull request ouverte par un workflow. Bouton **Approve
             workflows to run**, dans le bandeau au bas de cette page.
          2. Déposer une carte agent dans \`Services\` sur un iPhone, avec
             cette version installée, et vérifier que le service apparaît.
          3. Se rappeler que **fusionner distribue** : l'installateur
             synchronise les ressources à chacune de ses opérations, y
             compris une simple vérification, dès que la révision du dépôt
             a bougé. Cette bibliothèque atteindra donc le premier collègue
             qui ouvrira CTS Installer, sans qu'aucun numéro de version ait
             monté et sans qu'aucun message soit parti.

          Les contraintes vérifiées de PDF.js sont dans
          \`.claude/skills/docs/pdfjs.md\`.
          EOF
          )"
